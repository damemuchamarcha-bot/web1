backend:
  name: github
  repo: damemuchamarcha-bot/web1
  branch: main
  site_domain: damemarcha.com
  base_url: https://damemarcha.com
  auth_endpoint: api/auth

publish_mode: editorial_workflow

media_library:
  name: uploadcare
  config:
    publicKey: "0c8ace87549de321b182"
    useFullUrl: true    # <--- ESTO ES LO CLAVE: obliga a guardar "https://ucarecdn.com/..."
    tabs: "file url camera gdrive"
    effects: "crop,rotate"
    settings:
      crop: "21:9, 16:9, 4:3, 1:1, free"

media_folder: "public/uploads"
public_folder: "/uploads"

slug:
  clean_accents: true

collections:
  - name: "articles"
    label: "Artículos"
    folder: "content/articles"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Título"
        name: "title"
        widget: "string"

      - label: "Fecha"
        name: "date"
        widget: "datetime"

      - label: "Resumen (Excerpt)"
        name: "excerpt"
        widget: "text"

      - label: "Autor"
        name: "author"
        widget: "string"
        default: "Dame Marcha"

      - label: "Sección"
        name: "section"
        widget: "select"
        options: ["musica", "cine"]

      # Subcategoría con desplegable y libertad para teclear una nueva
      - label: "Subcategoría"
        name: "category"
        widget: "select"
        allow_add: true
        options:
          - { label: "Análisis de Cine", value: "analisis-de-cine" }
          - { label: "Crítica de Cine", value: "critica-de-cine" }
          - { label: "Próximos Estrenos", value: "proximos-estrenos" }
          - { label: "Análisis de Álbumes", value: "analisis-de-albumes" }
          - { label: "Directos", value: "directos" }

      - label: "Categoría"
        name: "categoryLabel"
        widget: "string"
        required: false

      - label: "Imagen de Portada"
        name: "image"
        widget: "image"

      # Selector manual de Portada para Decap CMS
      - label: "¿Destacar en Portada (Hero)?"
        name: "featured"
        widget: "boolean"
        default: false
        required: false

      # Campo de galería opcional para TODAS las entradas
      - label: "Galería de fotos (Mosaico)"
        name: "galeria"
        widget: "list"
        required: false
        hint: "Sube las fotos que quieras añadir a la galería del artículo"
        field:
          label: "Imagen"
          name: "image"
          widget: "image"

      - label: "Contenido del Artículo"
        name: "body"
        widget: "markdown"
